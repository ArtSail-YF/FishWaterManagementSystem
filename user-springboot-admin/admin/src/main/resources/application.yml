spring:
  config:
    import: optional:file:../../.env[.properties],optional:file:.env[.properties],optional:classpath:.env[.properties]
  application:
    name: admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/artsail_admin
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  session:
    timeout: 86400
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

mybatis:
  configuration:
    map-underscore-to-camel-case: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  detection:
    url: http://127.0.0.1:9001/detect
  upload-dir: uploads/ai
  chat:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: ${DEEPSEEK_BASE_URL}
    model-name: ${DEEPSEEK_MODEL}
    temperature: ${DEEPSEEK_TEMPERATURE:0.3}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}

mqtt:
  broker: tcp://127.0.0.1:1883
  client-id: aquaculture-backend
  topic: aquaculture/+/+/data

hefeng:
  api-key: 1ac95a34352b45558512c9267c265b6b