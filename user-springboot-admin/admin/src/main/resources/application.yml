spring:
  application:
    name: admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/artsail_admin
    username: root
    password: 123456
  session:
    timeout: 86400
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  detection:
    url: http://127.0.0.1:9001/detect
  upload-dir: uploads/ai

mqtt:
  broker: tcp://127.0.0.1:1883
  client-id: aquaculture-backend
  topic: aquaculture/+/+/data
